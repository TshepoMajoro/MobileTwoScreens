<!DOCTYPE html>
<html lang="en">
<head>

    <link rel="stylesheet" href="./ScreenTwo.css" type="text/css"/>
</head>
<body>
    <main>
        <h4>Contact Us</h4>
        <form>
            <label for="username">Username:</label>
            <input type="text" placeholder="Jane_Doe" id="username" name="username"/>
            <label for="email">Email:</label>
            <input type="email" placeholder="janeD@gmail.com" id="email" name="email"/>
            <label for="comment">Comments:</label>
            <textarea placeholder="Type your comment/s here"></textarea>
            <div class="Btns">
                <button>Cancel</button>
                <button>Submit</button>
            </div>
        </form>
        <nav class="menu">
            
        </nav>
    </main>
</body>
</html>
